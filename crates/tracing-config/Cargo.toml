[package]
name = "appbiotic-tracing-config"
version = "0.1.0"
edition = "2024"

[features]
default = ["prost-serde", "uniffi"]
prost-serde = [
    "dep:prost",
    "dep:prost-wkt",
    "dep:prost-wkt-types",
    "dep:serde",
    "dep:tonic",
]
uniffi = ["dep:uniffi"]

[dependencies]
anyhow = { version = "1.0.98", features = ["std"] }
prost = { version = "0.13.5", optional = true }
prost-wkt = { version = "0.6.0", optional = true }
prost-wkt-types = { version = "0.6.0", optional = true }
serde = { version = "1.0.219", optional = true, features = ["std", "derive"] }
tonic = { version = "0.13.0", optional = true }
uniffi = { version = "0.29.1", optional = true }

[dev-dependencies]
serde_json = { version = "1.0.140", features = ["std"] }

[build-dependencies]
anyhow = { version = "1.0.98", features = ["std"] }
appbiotic-api-prost-serde-build = { git = "https://github.com/appbiotic/api-build", rev = "b45d98d1e393c6892e7eb98c9af18e552932dd9b" }
appbiotic-api-protogen-spec = { git = "https://github.com/appbiotic/api-build", rev = "b45d98d1e393c6892e7eb98c9af18e552932dd9b" }
serde_json = { version = "1.0.140", features = ["std"] }
